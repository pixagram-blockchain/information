name: Check pages

# Runs on every pull request and on every push to main: links, anchors,
# status lines and indexes must all be in order. See README.md, "Editing".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check pages, links and anchors
        run: python3 .github/scripts/check_docs.py
